# 本地开发与 CI 的依赖：PostgreSQL + S3 兼容存储（RustFS）+ Mailpit。不使用 Redis（ADR 0004）。
# 默认值与根目录 .env.example 一致；只用于本地，不用于 staging/生产。
name: small0714

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: small0714
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev_password}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d small0714"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3 兼容存储，只用于本地和 CI（ADR 0005）。
    # MinIO 镜像已无法匿名拉取（Docker Hub 与 quay.io 均返回 401），改用 RustFS（Apache-2.0）。
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-s3_dev}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-s3_dev_password}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-59000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  s3-data:
